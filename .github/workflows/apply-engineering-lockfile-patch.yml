name: Apply engineering lockfile patch
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply embedded patch on branch and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/engineering-lockfile
          echo '' | base64 -d > /tmp/engineering-lockfile.patch
          git apply /tmp/engineering-lockfile.patch
          grep -q 'apps/engineering:' pnpm-lock.yaml
          git add pnpm-lock.yaml
          git commit -m "chore: add apps/engineering to pnpm-lock.yaml"
          git push -u origin HEAD:chore/engineering-lockfile --force
          gh pr create --base main --head chore/engineering-lockfile --title "chore: add apps/engineering to pnpm-lock.yaml" --body "Adds the apps/engineering importer to pnpm-lock.yaml so Vercel frozen lockfile installs succeed." || true
